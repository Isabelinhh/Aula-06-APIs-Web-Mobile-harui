<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haruy Sushi - Isabelly</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        barlow: ['Barlow', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ca3c3f',
                        dark: '#222222',
                        muted: '#999999',
                    }
                }
            }
        }
    </script>
</head>

<body class="font-barlow text-gray-800 bg-gray-100">

    <!-- ================= HEADER ================= -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-20">

                <!-- Logo -->
                <a href="#" class="flex items-center py-4 px-2">
                    <img src="./assets/img/logo.png" alt="Haruy Sushi" class="h-10"
                        onerror="this.src='../img/logo.png'">
                </a>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="#home" class="py-4 px-2 text-primary border-b-4 border-primary font-bold">HOME</a>
                    <a href="#cardapio"
                        class="py-4 px-2 text-gray-500 font-bold hover:text-primary transition duration-300">CARDÁPIO</a>
                </div>

                <!-- Mobile Button -->
                <div class="md:hidden flex items-center">
                    <button class="outline-none" id="btn-mobile">
                        <svg class="w-8 h-8 text-dark hover:text-primary transition-colors" fill="none"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="hidden md:hidden bg-white shadow-md border-t" id="menu-mobile">
            <ul>
                <li><a href="#home" class="block text-sm px-4 py-4 text-white bg-primary font-bold">HOME</a></li>
                <li><a href="#cardapio"
                        class="block text-sm px-4 py-4 hover:bg-primary hover:text-white transition duration-300 font-bold">CARDÁPIO</a>
                </li>
            </ul>
        </div>
    </nav>

    <script>
        const btnMob = document.getElementById('btn-mobile');
        const listMob = document.getElementById('menu-mobile');
        btnMob.onclick = () => listMob.classList.toggle('hidden');
    </script>


    <!-- BANNER -->
    <section id="home" class="text-center p-8 mt-10">
        <div class="md:flex md:items-center md:justify-center md:gap-10 max-w-6xl mx-auto">
            <article class="md:w-[45%] text-left">
                <h1 class="text-3xl md:text-5xl font-black leading-tight text-dark">
                    O verdadeiro sabor da cozinha japonesa
                </h1>
                <div class="mt-10">
                    <a href="#cardapio"
                        class="inline-block px-10 py-4 border-2 border-dark rounded-2xl text-lg font-bold hover:bg-primary hover:text-white hover:border-primary transition duration-300">
                        VEJA O CARDÁPIO
                    </a>
                </div>
            </article>
            <figure class="md:w-[45%] mt-10 md:mt-0">
                <img src="./assets/img/banner.png" alt="Prato japonês" class="w-full mx-auto drop-shadow-2xl"
                    onerror="this.src='../img/banner.png'">
            </figure>
        </div>
    </section>

    <!-- CARDÁPIO -->
    <section id="cardapio"
        class="max-w-[700px] mx-auto mt-24 pt-12 pb-4 px-4 text-center border-t border-dashed border-gray-400">
        <h2 class="text-3xl font-black mb-8">Cardápio</h2>

        <nav id="nav-categorias" class="overflow-x-auto whitespace-nowrap snap-x flex gap-2 mt-6 pb-2">
            <div class="animate-pulse flex gap-2">
                <div class="h-10 w-24 bg-gray-200 rounded-full"></div>
                <div class="h-10 w-24 bg-gray-200 rounded-full"></div>
                <div class="h-10 w-24 bg-gray-200 rounded-full"></div>
            </div>
        </nav>

        <div id="produtos-container" class="mt-8">
            <div id="categoria-titulo"
                class="text-left text-dark font-black text-2xl mb-6 border-l-4 border-primary pl-4">
                Carregando...
            </div>
            <div id="lista-produtos" class="grid grid-cols-2 gap-4 lg:gap-6">
                <!-- Injetado via JS -->
            </div>
        </div>
    </section>

    <script>
        const API_URL = 'https://aula-7-backend-vercel.vercel.app/api';
        const navCategorias = document.getElementById('nav-categorias');
        const listaProdutos = document.getElementById('lista-produtos');
        const categoriaTitulo = document.getElementById('categoria-titulo');
        let categoriasData = [];
        let carrinho = [];

        async function carregarCategorias() {
            try {
                const response = await fetch(`${API_URL}/categorias`);
                categoriasData = await response.json();
                renderizarBotoesCategorias();
                if (categoriasData.length > 0) {
                    selecionarCategoria(categoriasData[0].id, categoriasData[0].nome);
                }
            } catch (error) {
                console.error('Erro:', error);
                navCategorias.innerHTML = '<p class="text-red-500 font-bold">Erro ao carregar menu.</p>';
            }
        }

        function renderizarBotoesCategorias() {
            navCategorias.innerHTML = '';
            categoriasData.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `snap-start px-6 py-2 rounded-full font-bold text-sm transition-all duration-300 cursor-pointer flex-shrink-0 btn-cat bg-gray-200 text-dark`;
                btn.innerText = cat.nome.toUpperCase();
                btn.onclick = () => selecionarCategoria(cat.id, cat.nome);
                btn.dataset.id = cat.id;
                navCategorias.appendChild(btn);
            });
        }

        async function selecionarCategoria(id, nome) {
            categoriaTitulo.innerText = nome;
            const botoes = document.querySelectorAll('.btn-cat');
            botoes.forEach(btn => {
                if (parseInt(btn.dataset.id) === id) {
                    btn.classList.add('bg-primary', 'text-white', 'shadow-md');
                    btn.classList.remove('bg-gray-200', 'text-dark');
                } else {
                    btn.classList.remove('bg-primary', 'text-white', 'shadow-md');
                    btn.classList.add('bg-gray-200', 'text-dark');
                }
            });
            carregarProdutos(id);
        }

        async function carregarProdutos(categoriaId) {
            listaProdutos.innerHTML = '<div class="col-span-2 py-10 flex justify-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div></div>';
            try {
                const response = await fetch(`${API_URL}/produtos?categoriaId=${categoriaId}`);
                const produtos = await response.json();
                renderizarProdutos(produtos);
            } catch (error) {
                console.error('Erro:', error);
                listaProdutos.innerHTML = '<p class="col-span-2 text-red-500 font-bold">Erro ao carregar produtos.</p>';
            }
        }

        function renderizarProdutos(produtos) {
            listaProdutos.innerHTML = '';
            if (produtos.length === 0) {
                listaProdutos.innerHTML = '<p class="col-span-2 text-muted py-10">Nenhum produto nesta categoria.</p>';
                return;
            }
            produtos.forEach(p => {
                const precoFormatado = p.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const imgSource = (p.imagem && p.imagem.startsWith('http')) ? p.imagem : `./assets/img/${p.imagem || 'logo.png'}`;

                // Sanitização da descrição
                const descSanitizada = (p.descricao || '').replace(/'/g, "\\'").replace(/\n/g, " ");

                const card = document.createElement('div');
                card.className = "bg-white rounded-[25px] p-4 shadow-sm border border-gray-100 relative flex flex-col hover:shadow-xl transition-all duration-300 group";
                card.innerHTML = `
                    <div class="absolute inset-0 z-0 cursor-pointer" onclick="abrirModalDetalhes('${p.nome}', ${p.preco}, '${descSanitizada}', '${imgSource}', '${p.id}')"></div>
                    <div class="h-32 flex justify-center items-center mb-4 relative z-10 pointer-events-none">
                        <img src="${imgSource}" alt="${p.nome}" class="max-h-full max-w-full object-contain transition-transform duration-500 drop-shadow-md group-hover:scale-110" onerror="this.src='./assets/img/logo.png'">
                    </div>
                    <div class="text-left w-full mt-auto relative z-10 pointer-events-none">
                        <h4 class="font-bold text-dark text-sm leading-tight h-10 overflow-hidden line-clamp-2">${p.nome}</h4>
                        <p class="text-primary font-black text-xl mt-1">${precoFormatado}</p>
                    </div>
                    <button onclick="adicionarItem('${p.id}', '${p.nome}', ${p.preco})" 
                        class="w-full bg-primary text-white py-3 rounded-2xl text-xs font-black mt-3 shadow-md hover:bg-black active:scale-95 transition-all z-10 relative">
                        Adicionar 
                    </button>
                    `;
                listaProdutos.appendChild(card);
            });
        }

        // --- CARRINHO LOGIC ---
        function adicionarItem(id, nome, preco) {
            if (navigator.vibrate) navigator.vibrate(50);
            const index = carrinho.findIndex(item => item.id === id);
            if (index !== -1) carrinho[index].quantidade++;
            else carrinho.push({ id, nome, preco, quantidade: 1 });
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            localStorage.setItem('haruy_carrinho', JSON.stringify(carrinho));
            const total = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            const formatado = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            document.getElementById('carrinho-total').innerText = formatado;
            document.getElementById('modal-carrinho-total').innerText = formatado;

            if (carrinho.length > 0) document.getElementById('carrinho-footer').classList.remove('translate-y-full');
            else document.getElementById('carrinho-footer').classList.add('translate-y-full');

            renderizarItensModal();
        }

        function renderizarItensModal() {
            const container = document.getElementById('carrinho-itens-container');
            if (!container) return;
            container.innerHTML = '';
            carrinho.forEach(item => {
                const subTotal = (item.preco * item.quantidade).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-4 rounded-xl";
                div.innerHTML = `
                    <div class="flex-1 pr-4">
                        <h4 class="font-bold text-dark">${item.nome}</h4>
                        <p class="text-primary font-black mt-1">${subTotal}</p>
                    </div>
                    <div class="flex items-center gap-3 bg-white p-2 rounded-xl shadow-sm">
                        <button onclick="alterarQtd('${item.id}', -1)" class="w-8 h-8 font-black text-xl hover:text-primary">-</button>
                        <span class="font-black text-lg w-4 text-center">${item.quantidade}</span>
                        <button onclick="alterarQtd('${item.id}', 1)" class="w-8 h-8 font-black text-xl hover:text-primary">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function alterarQtd(id, delta) {
            const index = carrinho.findIndex(item => item.id === id);
            if (index !== -1) {
                carrinho[index].quantidade += delta;
                if (carrinho[index].quantidade <= 0) carrinho.splice(index, 1);
                if (carrinho.length === 0) fecharModalCarrinho();
                atualizarCarrinho();
            }
        }

        // --- MODAIS ---
        const modalDet = document.getElementById('detalhes-modal');
        const modalDetContent = document.getElementById('detalhes-modal-content');

        function abrirModalDetalhes(nome, preco, desc, img, id) {
            document.getElementById('detalhes-nome').innerText = nome;
            document.getElementById('detalhes-preco').innerText = preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('detalhes-desc').innerText = desc || "Sem descrição.";
            document.getElementById('detalhes-img').src = img;
            document.getElementById('detalhes-btn-add').onclick = () => { adicionarItem(id, nome, preco); fecharModalDetalhes(); };
            modalDet.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => modalDetContent.classList.remove('scale-95'), 10);
        }

        function fecharModalDetalhes() {
            modalDetContent.classList.add('scale-95');
            setTimeout(() => modalDet.classList.add('opacity-0', 'pointer-events-none'), 300);
        }

        function abrirModalCarrinho() {
            document.getElementById('carrinho-modal').classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => document.getElementById('carrinho-modal-content').classList.remove('translate-y-full'), 10);
        }

        function fecharModalCarrinho() {
            document.getElementById('carrinho-modal-content').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('carrinho-modal').classList.add('opacity-0', 'pointer-events-none'), 300);
        }

        function fecharPedido() {
            if (carrinho.length === 0) return;
            const btn = document.getElementById('btn-fechar-pedido');
            btn.innerText = "LOCALIZANDO...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    btn.innerText = "Fechar Pedido (Usar GPS)";
                    alert(`Pedido Fechado com Sucesso via GPS!\nLocalização: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                    carrinho = [];
                    atualizarCarrinho();
                    fecharModalCarrinho();
                },
                (err) => {
                    btn.innerText = "Fechar Pedido (Usar GPS)";
                    alert("Pedido Finalizado!");
                    carrinho = [];
                    atualizarCarrinho();
                    fecharModalCarrinho();
                }
            );
        }

        function inicializar() {
            const salvo = localStorage.getItem('haruy_carrinho');
            if (salvo) { carrinho = JSON.parse(salvo); atualizarCarrinho(); }
            carregarCategorias();
        }
        inicializar();
    </script>

    <!-- FOOTER -->
    <footer class="bg-gray-800 text-white text-center p-12 mt-24">
        <h3 class="text-xl font-black mb-4">Haruy Sushi</h3>
        <p class="opacity-80 mb-2">Rua Prof. Toledo, Número 500 - Centro Sorocaba-SP</p>
        <p class="opacity-80 mb-2">(15) 99789-9876</p>
        <p class="opacity-80">Aberto todos os dias das 14h às 23h</p>
    </footer>

    <!-- WHATSAPP -->
    <aside>
        <a href="https://wa.me/5515987654321" target="_blank"
            class="fixed bottom-24 right-6 lg:bottom-10 lg:right-10 z-40 hover:scale-110 transition-transform">
            <img src="./assets/img/whatsapp.png" class="h-14 w-14 drop-shadow-lg" alt="WhatsApp"
                onerror="this.src='../img/whatsapp.png'">
        </a>
    </aside>

</body>

</html>
